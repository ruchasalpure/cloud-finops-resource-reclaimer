spec_version: "0.1.0"
name: "cloud-finops-resource-reclaimer"
version: "1.0.0"
category: "devtools"
author: "Rucha Salpure"
description: "Discovers and safely orchestrates termination of unattached block storage, idle NAT gateways, orphaned load balancers, and overprovisioned Kubernetes clusters"
capabilities:
  - "idle-resource-scavenging"
  - "autonomous-decision-making"
  - "explainable-auditing"
  - "multi-agent-collaboration"
skills:
  - "idle-resource-scavenging"
tools:
  - "python_executor"
  - "audit_logger"
  - "schema_validator"
runtime:
  environment: "python3.11"
  memory_limit: "4GB"
  timeout_seconds: 300
governance:
  audit_logging: true
  human_in_the_loop: false
  maker_checker: true
  explainability_required: true
