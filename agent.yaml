spec_version: "0.1.0"
name: cloud-finops-resource-reclaimer
version: 1.0.0
description: Discovers and safely orchestrates termination of unattached block storage, idle NAT gateways, orphaned load balancers, and overprovisioned Kubernetes clusters.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - idle-resource-scavenging
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - devtools
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/cloud-finops-resource-reclaimer"
